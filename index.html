 return `<article data-fortune="${c.id}" class="fortune ${kind} ${record.status||''} ${ready?'ready':''}"><div class="card-top"><span>${symbol(c.kind)} ${c.kind.toUpperCase()}</span><span>${c.id}</span></div>${cardArt(c.id,c.kind)}<h3>${esc(c.name)}</h3><p class="effect"><span>WHEN IT COMES TRUE</span>${esc(c.rule)}</p><p class="prediction">${esc(c.prediction)}</p><div class="requirement"><span class="requirement-caption">TO COME TRUE</span><strong>${esc(c.requirement)}</strong>${s?.manual?slotHTML(record,s):m?`<div class="slots" aria-label="${m.missing} missing positions">${m.slots.map(t=>`<span class="slot ${t.die==='grace'?'virtual':t.die!==null?'hit':''}" title="${t.die==='grace'?'Grace':t.die!==null?'Die '+t.die:'Missing '+t.v}">${t.die==='grace'?'✦ ':''}${t.v}${t.die===null?'?':''}</span>`).join('')}</div>`:''}</div>${marker}${controls?'<div class="card-control">'+controls+'</div>':''}${status?'<div class="status">'+status+'</div>':''}</article>`;
}
function logHTML(s){return `<details class="log"><summary>How the reading unfolded (${s.log.length} events)</summary><ol>${s.log.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol></details>`;}
function play(s){
 let head=s.phase==='before'?['01 · DRAW YOUR CARDS','Meet today’s possibilities.','Read the cards before you roll. All three kinds can come true.']:s.phase==='choice'?['03 · A LITTLE CHOICE','A fortune asks you to choose.','The sealed fortunes are settled. Choose what happens to a remaining possibility.']:['02 · ROLL & DISCOVER',s.wave?'There’s more to your story.':'A little luck is in the air.','Drag your dice into card slots. Fill a card to make its fortune come true.'];
 const m=F.matches(s);
 let action=s.phase==='before'?button(animating?`Rolling…`:`Roll ${s.startDice} dice ↻`,'roll',disabled(true),'primary'):s.phase==='decision'?button(m.length?`Let ${m.length} fortune${m.length===1?'':'s'} come true →`:'Fill a card to continue','seal',disabled(m.length>0),'primary')+(m.length?'':button('Finish this reading','seal',disabled(true),'text')):'';
 return `<div class="play-board"><div class="stage-head"><div><div class="eyebrow">${head[0]} / ${s.date}</div><h2>${head[1]}</h2><p class="muted">${head[2]}</p></div><div class="stage-tools">${s.wave?button('✦ Last reveal','replay-reveal','','small'):''}<span class="stage-number">READING ${String(s.number).padStart(2,'0')}</span></div></div>${s.phase==='choice'?`<div class="choice-banner"><h2>${esc(F.cards[s.pending.source].name)}</h2><p>${esc(F.cards[s.pending.source].rule)}</p>${s.pending.optional?button('Keep the remaining fortunes','choose','data-skip="true" '+disabled(true),'small'):''}</div>`:''}<div class="spread-heading"><h3>Your possibilities <small>${s.spread.filter(c=>c.status!=='dismissed').length} cards</small></h3><div class="spread-navigation"><span>Slide to explore</span>${button('←','slide-cards','data-direction="-1" aria-label="Previous cards"')}${button('→','slide-cards','data-direction="1" aria-label="Next cards"')}</div></div><div class="cards card-track ${dealMotion?'dealing':''}" tabindex="0" role="region" aria-label="Your fortune cards. Scroll horizontally to explore.">${s.spread.filter(c=>c.status!=='dismissed').map(c=>fortune(c,s)).join('')}</div><p class="deck-hint">One die · one slot · move it whenever you like</p>${logHTML(s)}<section class="bottom-dock" aria-label="Dice and reading controls">${dice(s)}<div class="dock-action">${action}<p>${s.phase==='before'?'Roll, then drag your dice up into the cards.':s.phase==='choice'?'Choose a card above to continue.':m.length?'Your filled cards are ready to come true.':'Fill the slots on a card to awaken its fortune.'}</p></div></section></div>`;

}
function result(s,archived=false){
 const fulfilled=s.spread.filter(c=>c.status==='fulfilled').sort((a,b)=>a.wave-b.wave), today=localDate();
 let next=archived?button('← Back to journal','journal','','primary'):save.mode==='free'?button('Draw another reading →','begin',disabled(true),'primary'):s.date!==today&&!p().history.some(h=>h.date===today)?button('Draw today’s cards →','begin',disabled(true),'primary'):button('Try Free Play →','free','','primary');
 return `<section class="result-head"><div class="eyebrow">${archived?'FROM THE JOURNAL':'THE READING IS SEALED'} / ${s.date}</div><h2>${fulfilled.length?'What the day holds':'The day remains open.'}</h2><p class="muted">${esc(F.introduction(s))}</p><div class="actions">${next}${!archived&&s.wave?button('✦ Replay last reveal','replay-reveal'):''}${button('Copy reading','copy-reading',`data-index="${archived?journalIndex:-1}"`)}${button('Save reading','download-reading',`data-index="${archived?journalIndex:-1}"`)}</div></section><ul class="result-list">${fulfilled.map(c=>`<li><span class="label ${tone(F.cards[c.id].kind)}-text">${symbol(F.cards[c.id].kind)} ${esc(F.cards[c.id].name)}</span><p class="result-effect">${esc(F.cards[c.id].rule)}</p><p class="result-prediction">${esc(c.record?.prediction||F.cards[c.id].prediction)}</p></li>`).join('')}</ul>${!fulfilled.length?'<p class="muted">None of the drawn fortunes matched. There is no penalty, and this reading still counts toward your next power award.</p>':''}${s.awards.map(a=>a.id==='master'?'<div class="award">Collection complete / +1 reroll next reading.</div>':`<div class="award"><div class="eyebrow">A permanent upgrade</div><p>${esc(DECK.powers.find(k=>k.id===a.id).name)} ${roman(a.old)} -&gt; ${roman(a.rank)}</p><small>${esc(DECK.powers.find(k=>k.id===a.id).ranks[a.rank-1])}. Available next reading.</small></div>`).join('')}${carryText(s.next)}<details class="log"><summary>The full spread (${s.spread.length} revealed)</summary><div class="cards" style="margin-top:15px">${s.spread.map(c=>fortune(c,s)).join('')}</div></details>${logHTML(s)}${!archived&&save.mode==='daily'?'<p class="deck-hint">Saved for today. Come back tomorrow, or use Free Play for another reading.</p>':''}`;
}
function powers(){return `<div class="eyebrow">${label(save.mode)} / permanent collection</div><h2>What you carry into each day.</h2><p class="muted">A power stays forever. Each new copy upgrades its kind, up to rank III.</p>${statbar()}<div class="grid2">${DECK.powers.map(k=>{const r=p().ranks[k.id];return `<article class="power-card"><div class="row" style="justify-content:space-between"><h3>${esc(k.name)}</h3><span class="rank">[${roman(r)}]</span></div><p class="muted">${esc(k.text)}</p><p>Starting: ${esc(k.base)}.</p><ol>${k.ranks.map((text,i)=>`<li class="${r===i+1?'current':''}">${esc(text)}${r===i+1?' &lt; current':''}</li>`).join('')}</ol><p>${esc(k.rule)}</p><small>${esc(k.timing)}.</small></article>`;}).join('')}</div><div class="panel" style="margin-top:20px"><h3>How you earn powers</h3><p>Fortunes can award an upgrade. Every third completed reading also earns one. At most two awards are processed per reading, and they take effect next reading.</p><p class="muted">${p().upgrades.length} upgrade cards remain. ${3-p().completed%3} reading(s) until your next completion award. A full collection turns an award into +1 reroll next reading.</p></div>`;}
function journal(){if(journalIndex!==null&&p().history[journalIndex])return result(p().history[journalIndex],true);return `<div class="eyebrow">${label(save.mode)} / saved readings</div><h2>A record of possibilities.</h2><p class="muted">${p().completed} completed reading${p().completed===1?'':'s'}. Each result stays as it was.</p><div class="actions" style="margin-bottom:20px">${button('Export journal as text','journal-export',p().history.length?'':'disabled')}</div><div class="journal-list">${p().history.slice().reverse().map((s,i)=>{const count=k=>s.spread.filter(c=>c.status==='fulfilled'&&F.cards[c.id].kind===k).length;return `<button class="journal-entry" data-action="entry" data-index="${p().history.length-1-i}"><span>${s.date} <small>/ ${String(s.number).padStart(2,'0')}</small><small>${esc(F.introduction(s))}</small></span><span class="smallprint">+${count('Good')} ~${count('Neutral')} -${count('Bad')} &gt;</span></button>`;}).join('')||'<p class="empty">Nothing written yet. Your first reading will find its place here.</p>'}</div>`;}
function rules(){return `<div class="eyebrow">THE SMALL PRINT</div><h2>Let the cards guide you.</h2><div class="rule"><p>Start with three fortunes and four six-sided dice. Your permanent powers can change those allowances. All 48 fortunes share one deck: 16 good, 16 neutral, 16 bad.</p><h3>Roll, place, and fulfill.</h3><ol><li>Reveal your spread. Discernment can replace cards before rolling.</li><li>Roll once, then drag dice from the tray into card slots. Each die occupies one slot at a time. You can also select a die and tap or keyboard-activate a slot. Use earned rerolls, adjustments, or free slots if you have them.</li><li>Fill every slot on a card to make it ready. Resolve the filled cards together. Unfilled cards do not come true automatically, even if matching dice are elsewhere on the table.</li><li>Resolve their effects in reveal order. New dice or cards may begin another wave.</li><li>Your finished reading goes into the journal. Earned upgrades start next reading.</li></ol><details open><summary>Matching and free slots</summary><p>A die stays on one card until you move it. Drag it to another empty slot, or back into the tray. After a card comes true, you can move its dice to other cards; that fortune cannot trigger again. Its original completed pattern stays in your journal. Invalid drops leave the die where it was. Two different pairs must use two different values; four of a kind is not enough. Runs do not wrap from 6 to 1.</p><p>Grace adds one virtual die to one card only. Choose its value. You may move or remove an unsealed marker; once sealed, its value and target stay fixed for the day. Each fortune can have only one marker.</p></details><details><summary>Rerolls and adjustments</summary><p>There are no ordinary rerolls. One Second Chance charge rerolls one selected active die. One Adjustment charge changes it by +1 or -1, without wrapping. Temporary charges expire after the reading. Forced changes from fortunes spend no charges.</p></details><details><summary>Chains and inconvenient fortunes</summary><p>All matches commit before any effect runs. They cannot be undone or triggered twice. Effects run in reveal order, and all effects in a wave finish before new matches are checked. A dismissal can only target a still-unfulfilled fortune and returns its dice to the tray. Dice changed by rerolls, adjustments, or forced effects also return to the tray so you can place their new values.</p><p>Highest and lowest refer to active dice, with the earliest die breaking ties. Exhausted dice are unavailable for the rest of the reading. If an effect has nothing to change, its prediction still comes true.</p></details><details><summary>Powers and limits</summary><p>Six kinds, three upgrades each. Copies improve the existing kind; their totals do not add together. A third completed reading earns one power, with a limit of two power awards in any reading. No fortune removes a permanent rank.</p><p>Limits: 8 dice in the pool, at least 2 active; 8 fortunes in the spread; 12 total reveals including replacements; 3 free slots, 6 rerolls and 6 adjustments granted per reading. Spent or lost charges do not reopen these grant limits.</p><p>Next-reading modifiers are added together, then capped at -1 to +1 for each kind. They apply once in the same mode. Skipping a real day does not discard them.</p></details><details><summary>Daily and Free Play</summary><p>Daily saves one reading per local date. An unfinished reading resumes under its original date. Free Play allows another reading immediately and keeps its own permanent collection. Neither mode affects the other.</p><p>A quiet reading still counts. You choose which fortunes to fill, including whether to pursue an inconvenient one. Good, neutral, and bad refer to the prediction; each card also has its own effect. Press Finish this reading when you are done placing dice.</p></details><details><summary>Saving and sharing</summary><p>Progress stays in this browser. Export progress as JSON for a backup or to move to another device. The HTML download is a clean copy of the entire offline app, without your journal. Importing a save replaces both profiles only after confirmation.</p></details><h3>Requirement reference</h3>${DECK.patterns.map(([id,name,desc])=>`<p><b>${id} / ${esc(name)}</b><br><span class="muted">${esc(desc)}</span></p>`).join('')}</div>`;}
function library(){return `<div class="eyebrow">THE COMPLETE DECK / 48 FORTUNES</div><h2>Every possibility in the pack.</h2><div class="library-toolbar"><label class="sr-only" for="search">Search fortunes</label><input id="search" placeholder="Search by name, prediction or effect..." value="${esc(search)}">${['All','Good','Neutral','Bad'].map(k=>button(k,'filter',`data-filter="${k}" aria-pressed="${filter===k}"`,'small')).join('')}</div><div id="library-cards" class="cards library">${libraryCards()}</div>`;}
function libraryCards(){return DECK.fortunes.filter(c=>(filter==='All'||filter===c.kind)&&`${c.name} ${c.prediction} ${c.rule} ${c.requirement}`.toLowerCase().includes(search.toLowerCase())).map(c=>fortune({id:c.id,grace:null},null,true)).join('')||'<p class="muted">No fortunes match that search.</p>';}
let dockObserver;
function render(){
 const trackLeft=document.querySelector('.card-track')?.scrollLeft||0;
 dockObserver?.disconnect();
 if(typeof clearDrag==='function')clearDrag();
 const s=session();$('date').textContent=new Date().toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).toUpperCase();
 $('tabs').innerHTML=['reading','powers','journal','deck','rules'].map(t=>button(t==='deck'?'Deck':t[0].toUpperCase()+t.slice(1),'tab',`data-view="${t}" aria-current="${view===t?'page':'false'}"`,view===t?'active':'')).join('');
 $('modes').innerHTML=['daily','free'].map(m=>button(label(m),'mode',`data-mode="${m}" aria-pressed="${save.mode===m}"`)).join('');
 let body=view==='reading'?(s?(s.phase==='complete'?result(s):play(s)):startScreen()):view==='powers'?powers():view==='journal'?journal():view==='deck'?library():rules();
 $('app').innerHTML=`<div class="workspace ${view==='reading'?'reading-workspace':''} ${view==='reading'&&!s?'welcome-workspace':''} ${view==='reading'&&s&&s.phase!=='complete'?'board-workspace':''}"><section class="content">${body}</section>${sidebar()}</div>`;
 $('save-status').textContent=storageOK?'● Saved on this device':'Memory only · export to keep';
 const track=document.querySelector('.card-track');if(track)track.scrollLeft=trackLeft;
 const dock=document.querySelector('.bottom-dock');
 document.body.classList.toggle('board-active',!!dock);
 if(dock){dockObserver=new ResizeObserver(()=>document.documentElement.style.setProperty('--dock-space',(dock.offsetHeight+36)+'px'));dockObserver.observe(dock);}
 renderNotice();
}
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function confirmAction(title,text,fn){$('confirm-title').textContent=title;$('confirm-text').textContent=text;confirmCallback=fn;$('confirm-dialog').showModal();}
async function importSave(file){if(!file)return;try{if(file.size>10*1024*1024)throw new Error('Save files must be smaller than 10 MB.');const candidate=F.validate(JSON.parse(await file.text()));confirmAction('Replace saved progress?',`This imports ${candidate.profiles.daily.completed} Daily and ${candidate.profiles.free.completed} Free Play readings, replacing both collections and journals on this device.`,async()=>{if(broken){broken=null;try{localStorage.removeItem(KEY);}catch{storageOK=false;}}await atomic(current=>({...candidate,revision:current.revision+1}));view='reading';journalIndex=null;notify('Progress imported.');render();});}catch(e){notify('Import rejected: '+e.message);}finally{$('import-file').value='';}}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled||animating||suppressDiceClick)return;const a=b.dataset.action;
 if(a==='close-reveal'){$('fortune-reveal')?.close();return;}
 if(a==='next-reveal'){revealPage=Math.min(revealPage+1,revealState.ids.length-1);paintReveal();$('fortune-reveal').querySelector('.primary').focus();return;}
 if(a==='previous-reveal'){revealPage=Math.max(0,revealPage-1);paintReveal();$('fortune-reveal').querySelector('.primary').focus();return;}
 if(a==='replay-reveal'){showReveal(session());return;}
 if(a==='slide-cards'){const track=document.querySelector('.card-track');track?.scrollBy({left:Number(b.dataset.direction)*(track.querySelector('.fortune').offsetWidth+20),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return;}
 if(a==='tab'||a==='rules'||a==='journal'){view=a==='tab'?b.dataset.view:a;journalIndex=null;toast='';render();return;}
 if(a==='mode'||a==='free'){await dispatch({type:'MODE',mode:a==='free'?'free':b.dataset.mode});view='reading';journalIndex=null;selectedDie=null;render();return;}
 if(a==='begin'){$('live').textContent='';view='reading';journalIndex=null;selectedDie=null;dealMotion=true;await dispatch({type:'BEGIN',date:localDate()});setTimeout(()=>{dealMotion=false;document.querySelector('.dealing')?.classList.remove('dealing');},1000);return;}
 if(a==='roll'){await animatedRoll({type:'ROLL'});return;}
 if(a==='seal'){await dispatch({type:'SEAL'});return;}
 if(a==='replace'){await dispatch({type:'REPLACE',id:b.dataset.id});return;}
 if(a==='select-die'){selectedDie=Number(b.dataset.die);render();document.querySelector('[data-drag-die="'+selectedDie+'"]')?.focus({preventScroll:true});$('live').textContent='Die '+selectedDie+' selected. Choose a highlighted slot.';return;}
 if(a==='place-selected'){if(selectedDie)await placeDie(selectedDie,b.dataset.dropCard,Number(b.dataset.dropSlot));else notify('Select a die first, or drag one from the tray.');return;}
 if(a==='return-selected'){if(selectedDie)await dispatch({type:'RETURN',die:selectedDie});return;}
 if(a==='reroll'){await animatedRoll({type:'REROLL',id:selectedDie});return;}
 if(a==='adjust'){await dispatch({type:'ADJUST',id:selectedDie,delta:Number(b.dataset.delta)});return;}
 if(a==='grace'){const c=F.open(session()).find(c=>c.id===b.dataset.id);await dispatch({type:'GRACE',id:c.id,value:F.bestGrace(session(),c)});return;}
 if(a==='remove-grace'){await dispatch({type:'GRACE',id:b.dataset.id,value:null});return;}
 if(a==='choose'){await dispatch({type:'CHOOSE',id:b.dataset.skip?null:b.dataset.id});return;}
 if(a==='entry'){journalIndex=Number(b.dataset.index);view='journal';render();window.scrollTo({top:0,behavior:'instant'});return;}
 if(a==='filter'){filter=b.dataset.filter;render();return;}
 if(a==='export-html'){download('daily-fortune.html',ORIGINAL_HTML,'text/html');notify('A clean offline copy of the app was downloaded. Export progress separately to keep your journal.');return;}
 if(a==='export-save'){download('daily-fortune-progress-'+localDate()+'.json',JSON.stringify(save,null,2),'application/json');notify('Progress exported. Keep this file to restore both profiles.');return;}
 if(a==='import'){$('import-file').click();return;}
 if(a==='journal-export'){download('daily-fortune-'+save.mode+'-journal.txt',p().history.map(s=>F.reading(s,save.mode)).join('\n\n'+'='.repeat(48)+'\n\n'));return;}
 if(a==='copy-reading'||a==='download-reading'){const i=Number(b.dataset.index),s=i<0?session():p().history[i],text=F.reading(s,save.mode);if(a==='download-reading'){download('fortune-'+s.date+'.txt',text);return;}try{await navigator.clipboard.writeText(text);notify('Reading copied.');}catch{download('fortune-'+s.date+'.txt',text);notify('Clipboard unavailable; the reading was downloaded instead.');}return;}
 if(a==='reset'){const m=save.mode;confirmAction('Reset '+label(m)+'?',`This permanently removes the ${label(m)} collection and journal on this device. The other mode stays intact. Export progress first if you want a backup.`,async()=>{await dispatch({type:'RESET',mode:m,seed:seed()});journalIndex=null;view='reading';render();});return;}
 if(a==='takeover'){lease(true);try{const raw=localStorage.getItem(KEY);if(raw)save=F.validate(JSON.parse(raw));}catch{}render();return;}
 if(a==='recover'){download('daily-fortune-recovery.json',broken||'', 'application/json');return;}
 if(a==='discard-broken'){confirmAction('Reset unreadable save?','Export a recovery copy first if you want to keep the old data. This starts both collections again.',()=>{broken=null;save=F.fresh(seed());try{localStorage.removeItem(KEY);}catch{storageOK=false;}toast='';lease(true);render();});return;}
});
document.addEventListener('change',e=>{if(e.target.dataset.grace)dispatch({type:'GRACE',id:e.target.dataset.grace,value:Number(e.target.value)});});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('library-cards').innerHTML=libraryCards();}});
$('import-file').addEventListener('change',e=>importSave(e.target.files[0]));
$('confirm-yes').addEventListener('click',()=>{const fn=confirmCallback;confirmCallback=null;$('confirm-dialog').close();fn?.();});
$('confirm-no').addEventListener('click',()=>{$('confirm-dialog').close();confirmCallback=null;});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{save=F.validate(JSON.parse(e.newValue));notify('Progress updated in another tab.');}catch{notify('Another tab saved unreadable progress. Export a backup before reloading.');}}if(e.key===LEASE||e.key===KEY){lease();render();}});
window.addEventListener('pagehide',()=>{try{const l=JSON.parse(localStorage.getItem(LEASE)||'null');if(l?.owner===tabId)localStorage.removeItem(LEASE);}catch{}});
setInterval(()=>{const was=locked;lease();if(was!==locked)render();},5000);
lease();render();

/* Physical dice placement. Pointer events support mouse, pen and touch. */
function slotLabel(options){if(options.length===6)return 'Any';if(options.join(',')==='2,4,6')return 'Even';if(options.join(',')==='1,3,5')return 'Odd';return options.join(' / ')||'—';}
function slotHTML(c,s){
 const count=F.slotCount(c),canMove=s.phase==='decision'&&!animating&&!locked&&!broken;
 const physical=F.placements(c),historic=s.phase==='complete'&&c.sealedSlots;
 return `<div class="placement-slots" aria-label="Dice slots for ${esc(F.cards[c.id].name)}">${Array.from({length:count},(_,i)=>{
   const id=physical[i],d=typeof id==='number'?s.dice.find(d=>d.id===id):null;
   const old=c.sealedSlots?.[i],v=historic?old.v:d?.v;
   if(historic)return `<span class="slot-history" title="Value ${v} when this fortune came true"><span class="mini-face">${cube(v)}</span><small>Sealed</small></span>`;
   if(d)return `<button class="placed-die ${selectedDie===d.id?'selected':''}" data-action="select-die" data-drag-die="${d.id}" data-die="${d.id}" data-from-card="${c.id}" data-from-slot="${i}" aria-label="Die ${d.id}, ${d.v}, on ${esc(F.cards[c.id].name)}, slot ${i+1}. Drag to move." aria-pressed="${selectedDie===d.id}" ${disabled(canMove&&d.active)}><span class="mini-face" aria-hidden="true">${cube(d.v)}</span><small>Die ${d.id}</small></button>`;
   if(id==='grace')return `<span class="slot-grace" aria-label="Free slot, value ${c.grace}"><b>✦ ${c.grace}</b><small>Grace</small></span>`;
   if(c.status==='fulfilled')return `<span class="slot-history moved" title="Completed with ${old?.v??'this die'}; the die has moved"><b>✓ ${old?.v??''}</b><small>Moved</small></span>`;
   const options=F.slotOptions(s,c,i),accept=canMove&&c.status==='open';
   return `<button class="drop-slot ${accept&&selectedDie&&F.canPlace(s,selectedDie,c.id,i)?'can-place':''}" data-action="place-selected" data-drop-card="${c.id}" data-drop-slot="${i}" aria-label="${esc(F.cards[c.id].name)}, slot ${i+1}: ${slotLabel(options)}. Drop a die here." ${disabled(accept)}><span>${slotLabel(options)}</span><small>Drop die</small></button>`;
 }).join('')}</div>`;
}
async function placeDie(id,card,index){
 if(!F.canPlace(session(),id,card,index)){notify('That die does not fit this slot. Try a highlighted slot.');render();return false;}
 await dispatch({type:'PLACE',die:id,card,slot:index});
 $('live').textContent=`Die ${id} placed on ${F.cards[card].name}, slot ${index+1}.`;
 return true;
}

function dragTarget(x,y){const hit=document.elementFromPoint(x,y);return hit?.closest('[data-drop-card],[data-drop-tray]');}
function clearDrag(){
 if(!dragState)return;cancelAnimationFrame(dragState.frame);dragState.ghost?.remove();dragState.source?.classList.remove('drag-origin');
 if(dragState.source?.hasPointerCapture(dragState.pointer))dragState.source.releasePointerCapture(dragState.pointer);
 document.querySelectorAll('.drop-allowed,.drop-over,.drop-denied').forEach(el=>el.classList.remove('drop-allowed','drop-over','drop-denied'));
 document.body.classList.remove('drag-in-progress');dragState=null;
}
function highlightDrop(){
 if(!dragState?.moving)return;
 document.querySelectorAll('.drop-over,.drop-denied').forEach(el=>el.classList.remove('drop-over','drop-denied'));
 const target=dragTarget(dragState.x,dragState.y);
 if(target){const fits=target.hasAttribute('data-drop-tray')||F.canPlace(session(),dragState.id,target.dataset.dropCard,Number(target.dataset.dropSlot));target.classList.add(fits?'drop-over':'drop-denied');}
}
function dragFrame(){
 if(!dragState?.moving)return;
 const track=document.querySelector('.card-track'),bounds=track?.getBoundingClientRect();
 if(bounds&&dragState.y>bounds.top&&dragState.y<bounds.bottom){
   if(dragState.x<bounds.left+65)track.scrollLeft-=Math.ceil((bounds.left+65-dragState.x)/7);
   else if(dragState.x>bounds.right-65)track.scrollLeft+=Math.ceil((dragState.x-bounds.right+65)/7);
 }
 const edge=70,y=dragState.y,height=window.innerHeight;
 const dock=document.querySelector('.bottom-dock')?.getBoundingClientRect();
 if(dock&&y>=dock.top){highlightDrop();dragState.frame=requestAnimationFrame(dragFrame);return;}

 if(y<edge)window.scrollBy(0,-Math.ceil((edge-y)/9));else if(y>height-edge)window.scrollBy(0,Math.ceil((y-height+edge)/9));
 highlightDrop();dragState.frame=requestAnimationFrame(dragFrame);
}
document.addEventListener('pointerdown',e=>{
 const source=e.target.closest('[data-drag-die]');
 if(!source||e.button!==0||source.disabled||animating||busy||locked||session()?.phase!=='decision')return;
 clearDrag();dragState={id:Number(source.dataset.dragDie),source,pointer:e.pointerId,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,moving:false,frame:null};
 source.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
 if(!dragState||e.pointerId!==dragState.pointer)return;
 dragState.x=e.clientX;dragState.y=e.clientY;
 if(!dragState.moving&&Math.hypot(e.clientX-dragState.startX,e.clientY-dragState.startY)>6){
   dragState.moving=true;selectedDie=dragState.id;
   const d=session().dice.find(d=>d.id===dragState.id),ghost=document.createElement('div');ghost.className='dice-drag-ghost';ghost.setAttribute('aria-hidden','true');ghost.innerHTML=cube(d.v);document.body.append(ghost);dragState.ghost=ghost;dragState.source.classList.add('drag-origin');document.body.classList.add('drag-in-progress');
   document.querySelectorAll('[data-drop-card]').forEach(el=>{if(F.canPlace(session(),dragState.id,el.dataset.dropCard,Number(el.dataset.dropSlot)))el.classList.add('drop-allowed');});document.querySelector('[data-drop-tray]')?.classList.add('drop-allowed');
   dragState.frame=requestAnimationFrame(dragFrame);
 }
 if(dragState.moving){e.preventDefault();dragState.ghost.style.left=(e.clientX-28)+'px';dragState.ghost.style.top=(e.clientY-28)+'px';highlightDrop();}
},{passive:false});
document.addEventListener('pointerup',async e=>{
 if(!dragState||e.pointerId!==dragState.pointer)return;
 const {id,moving}=dragState,target=dragTarget(e.clientX,e.clientY);
 if(moving){e.preventDefault();suppressDiceClick=true;setTimeout(()=>{suppressDiceClick=false;},350);}
 clearDrag();if(!moving)return;
 if(target?.hasAttribute('data-drop-tray')){await dispatch({type:'RETURN',die:id});$('live').textContent=`Die ${id} returned to the tray.`;}
 else if(target?.dataset.dropCard)await placeDie(id,target.dataset.dropCard,Number(target.dataset.dropSlot));
 else {notify('Die returned to its previous position. Drop it onto a slot or into the tray.');render();}
});
document.addEventListener('pointercancel',clearDrag);
window.addEventListener('blur',clearDrag);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dragState){clearDrag();notify('Move cancelled.');}});
</script></body></html>
